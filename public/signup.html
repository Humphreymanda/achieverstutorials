<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Create account · achievers tutorials</title>
      <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#001B44" />
    
    <!-- iOS Specific App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Achievers" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <img src="/assets/logo.png" alt="achievers tutorials" class="brand-img" />
        <div class="brand-tag">Learn • Practice • Succeed</div>
      </div>

      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Free for CBU students.</p>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="full_name">Full name</label>
          <input id="full_name" name="full_name" type="text" autocomplete="name" required placeholder="e.g. Chanda Mwila" />
        </div>
        <div class="field">
          <label for="student_number">Student number</label>
          <input id="student_number" name="student_number" type="text" required placeholder="e.g. 20240001" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@student.cbu.ac.zm" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters" />
        </div>
        <div class="form-error" role="alert" hidden></div>
        <button class="btn-primary" type="submit">
          <span class="btn-label">Create account</span>
          <span class="btn-spinner" hidden></span>
        </button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </div>
  </main>

  <script src="/env.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
